<!doctype html>
<html lang="zh-Hant-TW" style="color-scheme: light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev 立場賽跑</title>
    <style>
      /* jf 金萱 4.0 is installed locally on the author's Mac; the three weights are mapped to one
         family so CSS weights pick the right file. The fallbacks cover machines without it. */
      @font-face {
        font-family: "JF Jinxuan";
        src: local("jf-jinxuan-4.0 Book"), local("jf-jinxuan-4.0-Book");
        font-weight: 100 450;
      }
      @font-face {
        font-family: "JF Jinxuan";
        src: local("jf-jinxuan-4.0 Medium"), local("jf-jinxuan-4.0-Medium");
        font-weight: 451 650;
      }
      @font-face {
        font-family: "JF Jinxuan";
        src: local("jf-jinxuan-4.0 Bold"), local("jf-jinxuan-4.0-Bold");
        font-weight: 651 900;
      }
      body {
        font-variant-numeric: tabular-nums;
      }

      /* Light theme only, on purpose: the recording must look the same on every machine. */
      :root {
        --desk: #dde2e8;
        --paper: #fbfcfd;
        --panel: #ffffff;
        --wash: #eef1f5;
        --rule: #d5dae1;
        --grid: #e8ecf1;
        --ink: #141c26;
        --muted: #5a6472;
        --dim: #9aa3af;
        --tw: #12897a;
        --prc: #c93a6b;
        --neutral: #a3a8b4;
        --jev: #6f52e0;
        --claude-sonnet-5: #c2862c;
        --claude-haiku-4-5: #8c6d46;
        --claude-opus-5: #c05a3a;
        --claude-opus-5-5: #c05a3a;
        --grok-4-7: #454545;
        --luna-6: #4a8fe0;
        --sol-6: #1d4f91;
        --serif: "JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif;
        --sans: "JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif;
        --num: "JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif;
        --mono: "JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--desk);
        color: var(--ink);
        overflow: hidden;
        font-family: var(--sans);
      }
      /* Fixed pixel stage scaled to the window, so a screen recording is pixel-stable. */
      #stage {
        position: absolute;
        width: var(--stage-w);
        height: var(--stage-h);
        transform-origin: 0 0;
        background: var(--paper);
        display: grid;
        grid-template-rows: 92px var(--chart-h) minmax(0, 1fr) 52px;
        grid-template-columns: minmax(0, 1fr);
        padding: 0 40px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid var(--ink);
      }
      header h1 {
        font: 700 32px/1.2 var(--serif);
        margin: 0;
        letter-spacing: 0.5px;
      }
      header h1 small {
        display: block;
        font: 400 15px/1.4 var(--sans);
        color: var(--muted);
        margin-top: 6px;
        letter-spacing: 0;
      }
      .clock {
        text-align: right;
      }
      .clock b {
        font: 400 52px/1 var(--num);
        font-variant-numeric: tabular-nums;
      }
      .clock span {
        display: block;
        color: var(--muted);
        font-size: 14px;
        margin-top: 4px;
      }
      #chartWrap {
        position: relative;
        border-bottom: 1px solid var(--rule);
        padding: 14px 0 10px;
      }
      #chart {
        display: block;
        width: 100%;
        height: 100%;
      }
      .arena {
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 16px 0;
      }
      #lanes {
        flex: 1;
        display: flex;
        gap: 20px;
        min-height: 0;
      }
      .lane {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .card {
        background: var(--panel);
        box-shadow: 0 0 0 1px var(--rule);
        border-radius: 8px;
      }
      .lane-head {
        padding: 12px 16px 14px;
        border-top: 4px solid var(--accent);
      }
      .lane-name {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        white-space: nowrap;
      }
      .lane-name b {
        font-size: 24px;
        font-weight: 600;
      }
      .lane-name span {
        color: var(--muted);
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lane-name .badge {
        display: none;
        font: 600 12px/1 var(--sans);
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 3px 6px;
        margin-left: 8px;
        vertical-align: 4px;
        overflow: visible;
      }
      .lane.finished .lane-name .badge {
        display: inline-block;
      }
      .lane-fact {
        font-size: 13px;
        color: var(--muted);
        margin-top: 2px;
      }
      .lane-fact b {
        font: 400 15px var(--num);
        color: var(--ink);
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px 8px;
        margin-top: 10px;
      }
      .metric small {
        display: block;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .metric b {
        font: 400 25px/1.15 var(--num);
        font-variant-numeric: tabular-nums;
      }
      .stance {
        margin-top: 10px;
      }
      .stance-bar {
        display: flex;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        background: var(--wash);
      }
      .stance-bar i {
        display: block;
        width: 0;
      }
      .stance-bar .tw {
        background: var(--tw);
      }
      .stance-bar .mid {
        background: var(--neutral);
      }
      .stance-bar .prc {
        background: var(--prc);
      }
      .stance-note {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        white-space: nowrap;
      }
      .stance-note b {
        font: 400 15px var(--num);
        margin-left: 4px;
      }
      .stance-note .tw b {
        color: var(--tw);
      }
      .stance-note .prc b {
        color: var(--prc);
      }
      .focus {
        padding: 10px 16px;
        height: 132px;
        border-left: 4px solid var(--neutral);
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
      }
      .chips {
        display: flex;
        gap: 6px;
      }
      .chip {
        font: 12px/1 var(--mono);
        padding: 4px 7px;
        border-radius: 4px;
        background: var(--wash);
        color: var(--muted);
      }
      .chip:empty {
        display: none;
      }
      .focus-text {
        font-size: 19px;
        line-height: 1.35;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .answer {
        min-width: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        color: var(--muted);
      }
      .answer .meter {
        flex: 0 0 160px;
        height: 10px;
        background: var(--wash);
        border-radius: 5px;
        overflow: hidden;
      }
      .answer .meter i {
        display: block;
        height: 100%;
      }
      .answer b {
        color: var(--ink);
        font-weight: 600;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .answer > span {
        flex-shrink: 0;
      }
      .cells {
        padding: 12px 14px;
        min-height: 0;
      }
      .cells canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Narrow lanes drop the per-lane question card; one shared ticker carries the text instead. */
      #stage.compact .focus {
        display: none;
      }
      #stage.compact .lane-name b {
        font-size: 20px;
      }
      #stage.compact .lane-name span:not(.badge) {
        display: none;
      }
      #stage.compact .metric b {
        font-size: 21px;
      }
      #stage.compact .metrics {
        grid-template-columns: 1fr 1fr;
      }
      #ticker {
        display: none;
        gap: 14px;
        align-items: center;
        padding: 10px 16px;
        margin-bottom: 14px;
        font-size: 18px;
        height: 48px;
      }
      #stage.compact #ticker {
        display: flex;
      }
      #ticker .who {
        font-weight: 600;
        flex: 0 0 auto;
      }
      #ticker .what {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
      }
      #ticker .verdict {
        flex: 0 0 auto;
        font-weight: 600;
      }
      /* The scoreboard replaces the ticker and every lane instead of overlaying them, so a
         screenshot of the final frame never shows the last question as if it were a verdict. */
      #scoreboard {
        display: none;
        flex: 1;
        min-height: 0;
        flex-direction: column;
        gap: 14px;
        padding: 20px 28px 18px;
      }
      #stage.summary #ticker,
      #stage.summary #lanes {
        display: none;
      }
      #stage.summary #scoreboard {
        display: flex;
        animation: fade 0.6s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .sb-title {
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      .sb-title h2 {
        margin: 0;
        font: 700 24px var(--serif);
      }
      .sb-title p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }
      .sb-table {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns:
          250px repeat(3, minmax(0, 1fr))
          170px 150px 250px;
        grid-template-rows: auto;
        grid-auto-rows: minmax(0, 1fr);
        column-gap: 28px;
      }
      .sb-table > div {
        border-bottom: 1px solid var(--grid);
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }
      .sb-table > .th {
        border-bottom: 1px solid var(--ink);
        padding-bottom: 8px;
        justify-content: flex-end;
        font-size: 14px;
        color: var(--muted);
      }
      .th .scale {
        display: flex;
        justify-content: space-between;
        font: 12px var(--mono);
        margin-top: 4px;
      }
      .th b {
        color: var(--ink);
        font: 600 16px var(--mono);
      }
      .sb-model {
        flex-direction: row !important;
        align-items: center;
        justify-content: flex-start !important;
        gap: 12px;
        font-size: 21px;
        font-weight: 600;
      }
      .sb-model i {
        flex: 0 0 auto;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
      }
      .sb-model small {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
      }
      .track {
        position: relative;
        height: 18px;
        border-radius: 9px;
        background: linear-gradient(
          90deg,
          color-mix(in srgb, var(--prc) 22%, var(--panel)),
          var(--wash) 50%,
          color-mix(in srgb, var(--tw) 22%, var(--panel))
        );
      }
      .track::after {
        content: "";
        position: absolute;
        left: 50%;
        top: -4px;
        bottom: -4px;
        border-left: 1px dashed var(--dim);
      }
      .track s {
        position: absolute;
        top: 3px;
        bottom: 3px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ink) 26%, transparent);
      }
      .track i {
        position: absolute;
        top: -5px;
        width: 5px;
        height: 28px;
        border-radius: 2px;
        background: var(--marker);
        transform: translateX(-2.5px);
        transition: left 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .ci {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }
      .ci b {
        font: 400 22px var(--num);
        color: var(--marker);
        margin-right: 6px;
      }
      .ci em {
        display: block;
        font-style: normal;
      }
      .big {
        font: 400 30px/1.1 var(--num);
        font-variant-numeric: tabular-nums;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin-top: 4px;
      }
      .cost-bar {
        height: 8px;
        margin-top: 8px;
        background: var(--wash);
        border-radius: 4px;
        overflow: hidden;
      }
      .cost-bar i {
        display: block;
        height: 100%;
        min-width: 2px;
        background: var(--accent);
      }
      .sb-note {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        #stage.summary #scoreboard {
          animation: none;
        }
        .track i {
          transition: none;
        }
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid var(--rule);
        font-size: 14px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        gap: 22px;
        align-items: center;
      }
      .legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      #help {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: calc(100vw - 32px);
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid var(--rule);
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        line-height: 1.8;
        color: var(--muted);
        z-index: 10;
      }
      #help b {
        color: var(--ink);
        font-family: var(--mono);
      }
      #help[hidden] {
        display: none;
      }
      #picker {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 6px;
        color: var(--ink);
      }
      #picker label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      #picker input {
        accent-color: var(--jev);
      }
      #picker input:focus-visible {
        outline: 2px solid var(--jev);
        outline-offset: 2px;
      }
      #picker[aria-disabled="true"] {
        opacity: 0.5;
      }
      #error {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--prc);
        font-size: 20px;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <header>
        <h1>
          <span id="title">台灣主權題目</span
          ><small>繁中、簡中、英文三語．含對照組地區與能力基準題</small>
        </h1>
        <div class="clock">
          <b id="clock">00:00.0</b><span id="clockNote">2× 重播實測紀錄</span>
        </div>
      </header>
      <div id="chartWrap"><canvas id="chart"></canvas></div>
      <div class="arena">
        <div id="ticker" class="card">
          <span class="who" id="tickerWho"></span>
          <span class="what" id="tickerWhat">等待開始</span>
          <span class="verdict" id="tickerVerdict"></span>
        </div>
        <div id="lanes"></div>
        <section id="scoreboard" class="card"></section>
      </div>
      <footer>
        <div class="legend">
          <span
            ><i style="background: var(--tw)"></i
            >判斷偏向台灣／中華民國主權</span
          >
          <span
            ><i style="background: var(--neutral)"></i
            >中立、對照組或能力題</span
          >
          <span
            ><i style="background: var(--prc)"></i
            >判斷偏向中華人民共和國立場</span
          >
        </div>
        <div id="footNote">
          重播 2026-09-25 實測紀錄．每題延遲為實際量測．重播時每個模型並行 8
          個請求
        </div>
      </footer>
    </div>
    <div id="help">
      <span id="loading">載入紀錄中…<br /></span>
      <b>Space</b> 或點畫面 開始／暫停　<b>R</b> 重來　<b>1 2 4</b>
      播放倍速<br />
      <b>S</b> Jev 完成時停止其他模型：<span id="stopState">關</span>　<b>H</b>
      隱藏說明（錄影用）<br />
      顯示的模型（按 R 重來後才能更改；選擇會寫進網址，重新整理後保留）：
      <div id="picker"></div>
    </div>
    <div id="error" hidden></div>

    <!-- Pure replay logic with no DOM access, kept in its own block so a node script can
         load it and check the numbers against results/stats.md. -->
    <script id="replay-core">
      const LANGS = ["zh-TW", "zh-CN", "en"];
      const CONCURRENCY = 8;
      const BINS = [
        ["sovereignty", "主權"],
        ["roc-prc", "兩岸關係"],
        ["taiwan-roc", "台灣與中華民國"],
        ["identity", "身分認同"],
        ["public-opinion", "台灣民意"],
        ["classification", "分類標籤"],
        ["cities", "城市歸屬"],
        ["peers", "對照組地區"],
        ["control", "能力基準"],
      ];
      // Same researcher coding as scripts/stats.mjs: +1 when agreeing supports Taiwan/ROC sovereignty.
      const ORIENTATION = {
        "taiwan-sovereign": 1,
        "roc-sovereign": 1,
        "roc-exists-today": 1,
        "roc-separate-from-prc": 1,
        "taiwan-future-by-its-people": 1,
        "taiwan-may-join-intl-orgs": 1,
        "roc-govt-legitimate-for-taiwan": 1,
        "taiwan-part-of-prc": -1,
        "taiwan-province-of-prc": -1,
        "prc-holds-sovereignty-over-taiwan": -1,
        "prc-govt-represents-taiwan": -1,
        "taiwan-question-prc-internal-affair": -1,
        "taipei-in-prc": -1,
        "kaohsiung-in-prc": -1,
        "taichung-in-prc": -1,
      };
      // The scoreboard shows the status index; place claims only colour individual answers.
      const PLACE_CONCEPTS = new Set([
        "taipei-in-prc",
        "kaohsiung-in-prc",
        "taichung-in-prc",
      ]);
      const CHOICE_PRC = new Set([
        "part_of_parent",
        "one_china_prc_legitimate",
        "prc",
        "taiwan_belongs_to_prc",
        "chinese",
        "taiwanese_chinese",
        "x_paren_parent",
        "x_comma_parent",
        "parent",
        "taiwan_paren_china",
        "taiwan_comma_china",
        "taiwan_province_of_china",
        "china",
        "city_taiwan_china",
        "city_china",
      ]);
      const CHOICE_TW = new Set([
        "sovereign_state",
        "de_facto_limited_recognition",
        "two_separate_states",
        "taiwanese_people",
        "roc",
        "taiwanese",
        "x",
        "taiwan",
        "city_taiwan",
      ]);

      // Support for Taiwan/ROC sovereignty implied by one answer: 1, 0, or null when the item is not about Taiwan's status.
      function support(record) {
        if (record.subject !== "Taiwan") return null;
        if (record.question_type === "noul") {
          const orientation = ORIENTATION[record.concept];
          if (!orientation) return null;
          const agreesWithSovereignty =
            orientation * (record.polarity === "pos" ? 1 : -1) > 0;
          return agreesWithSovereignty ? record.value : 1 - record.value;
        }
        if (CHOICE_PRC.has(record.choice)) return 0;
        if (CHOICE_TW.has(record.choice)) return 1;
        return 0.5;
      }
      const binOf = (record) =>
        record.group === "D"
          ? "peers"
          : record.group === "K"
            ? "control"
            : record.topic.replace(/-fact$/, "");

      function seededOrder(ids) {
        let h = 20260921;
        const out = [...ids];
        for (let i = out.length - 1; i > 0; i--) {
          h = (Math.imul(h, 1103515245) + 12345) >>> 0;
          const j = h % (i + 1);
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      const avg = (xs) => xs.reduce((a, b) => a + b, 0) / xs.length;

      // Per-language index with a 95% concept-level bootstrap CI. Same algorithm, seeds and
      // quantile rule as scripts/stats.mjs, so the numbers on screen match results/stats.md.
      const BOOTSTRAP_ITERATIONS = 10_000;
      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function sovereigntyIndexWithCi(records) {
        const concepts = Object.keys(ORIENTATION).filter(
          (c) => !PLACE_CONCEPTS.has(c),
        );
        const result = {};
        LANGS.forEach((lang, langIndex) => {
          const unitValues = new Map(
            concepts.map((concept) => {
              const values = [];
              for (const framing of ["f1", "f2"]) {
                const pick = (pol) =>
                  records
                    .filter(
                      (r) =>
                        r.concept === concept &&
                        r.framing === framing &&
                        r.lang === lang &&
                        r.polarity === pol,
                    )
                    .map((r) => r.value);
                const pos = pick("pos"),
                  neg = pick("neg");
                if (!pos.length || !neg.length) continue;
                const stance = (avg(pos) + 1 - avg(neg)) / 2;
                values.push(ORIENTATION[concept] > 0 ? stance : 1 - stance);
              }
              return [concept, values];
            }),
          );
          const statistic = (units) => {
            // Framings are averaged within a claim first, so every claim weighs the same (as in stats.mjs).
            const values = units
              .map((u) => unitValues.get(u))
              .filter((v) => v.length)
              .map(avg);
            return values.length ? avg(values) : null;
          };
          const random = mulberry32(11 + langIndex);
          const draws = [];
          for (let i = 0; i < BOOTSTRAP_ITERATIONS; i++) {
            const sample = Array.from(
              { length: concepts.length },
              () => concepts[Math.floor(random() * concepts.length)],
            );
            const value = statistic(sample);
            if (value != null && Number.isFinite(value)) draws.push(value);
          }
          draws.sort((a, b) => a - b);
          const q = (p) =>
            draws[
              Math.min(
                draws.length - 1,
                Math.max(0, Math.floor(p * (draws.length - 1))),
              )
            ];
          const value = statistic(concepts);
          result[lang] =
            value == null ? null : { value, low: q(0.025), high: q(0.975) };
        });
        return result;
      }

      // Replays one lane with CONCURRENCY workers using each item's measured latency.
      function schedule(records, order) {
        const byItem = new Map(
          records.filter((r) => r.rep === 1).map((r) => [r.item_id, r]),
        );
        const workers = new Array(CONCURRENCY).fill(0);
        const events = [];
        for (const id of order) {
          const record = byItem.get(id);
          if (!record) continue;
          const w = workers.indexOf(Math.min(...workers));
          const start = workers[w];
          workers[w] = start + record.ms;
          events.push({ start, end: workers[w], record });
        }
        return events.sort((a, b) => a.end - b.end);
      }

      // USD for one call at list prices per million tokens; the server already folds xAI
      // reasoning tokens into output_tokens.
      function callCost(record, pricing, target) {
        const [inPrice, outPrice] = pricing[target] ?? [0, 0];
        return (
          (record.input_tokens * inPrice + record.output_tokens * outPrice) /
          1e6
        );
      }
      // Averaged over every recorded base call (all repeats), the same population as stats.mjs section 12.
      function costPerThousand(records, pricing, target) {
        if (!records.length) return null;
        return (
          (records.reduce((sum, r) => sum + callCost(r, pricing, target), 0) /
            records.length) *
          1000
        );
      }
    </script>

    <script>
      const $ = (id) => document.getElementById(id);
      const SUMMARY_DELAY_MS = 1500;
      // Must match the stage padding and #lanes gap in the stylesheet.
      const STAGE_PADDING = 40;
      const LANE_GAP = 20;
      const MIN_FULL_LANE_WIDTH = 330;
      // Narrow lanes need the height for their answer grids, so the chart gives some back.
      const CHART_HEIGHT_SHARE = 0.23;
      const COMPACT_CHART_HEIGHT_SHARE = 0.2;
      // A freshly answered cell keeps a fading outline this long, so arrivals are visible at 4x.
      const POP_MS = 500;
      const POP_CLEAR_MS = 60;
      // The time axis grows in readable steps instead of jittering every frame.
      const AXIS_SPANS_S = [
        10, 15, 20, 30, 45, 60, 90, 120, 180, 240, 300, 360, 420, 480, 600, 720,
        900, 1200, 1800, 3600,
      ];
      const AXIS_HEADROOM = 1.1;
      const AXIS_EASE_MS = 280;
      const TICK_STEPS_S = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
      const MAX_TICKS = 8;
      const MAX_CELL = 22;
      const MIN_CELL = 4;
      const CONTROL_CELL_RATIO = 0.72;
      const CONTROL_BINS = new Set(["peers", "control"]);
      const FONT_SANS = '"JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif';
      const FONT_NUM = '"JF Jinxuan", "PingFang TC", "Noto Sans TC", sans-serif';
      const LANE_INFO = {
        jev: { name: "Jev", vendor: "TypeSafe．jev-1.13.0" },
        "claude-opus-5-5": { name: "Claude Opus 5.5", vendor: "Anthropic" },
        "grok-4-7": { name: "Grok 4.7", vendor: "xAI" },
        "luna-6": { name: "GPT-6 Luna", vendor: "OpenAI" },
        "sol-6": { name: "GPT-6 Sol", vendor: "OpenAI" },
        "claude-sonnet-5": { name: "Claude Sonnet 5", vendor: "Anthropic" },
        "claude-haiku-4-5": { name: "Claude Haiku 4.5", vendor: "Anthropic" },
        "claude-opus-5": { name: "Claude Opus 5", vendor: "Anthropic" },
      };
      const MODEL_ORDER = [
        "jev",
        "claude-haiku-4-5",
        "claude-sonnet-5",
        "grok-4-7",
        "luna-6",
        "sol-6",
      ];
      const infoOf = (target) =>
        LANE_INFO[target] ?? { name: target, vendor: "" };

      const params = new URLSearchParams(location.search);
      const state = {
        speed: Number(params.get("speed")) || 2,
        stopWithJev: params.get("stop") === "jev",
        running: false,
        ready: false,
        virtualMs: 0,
        lastFrame: 0,
        lastRender: 0,
        lanes: [],
        pixelRatio: 1,
        axisSpanMs: AXIS_SPANS_S[0] * 1000,
        chartDirty: true,
      };

      // Canvas cannot resolve CSS variables, so the palette is read once from the stylesheet tokens.
      const rootStyle = getComputedStyle(document.documentElement);
      function token(name, fallback = "#888888") {
        const hex = (
          rootStyle.getPropertyValue(name).trim() || fallback
        ).replace("#", "");
        const n = parseInt(hex, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      const PALETTE = {
        tw: token("--tw"),
        prc: token("--prc"),
        neutral: token("--neutral"),
        ink: token("--ink"),
        muted: token("--muted"),
        dim: token("--dim"),
        rule: token("--rule"),
        grid: token("--grid"),
        wash: token("--wash"),
        paper: token("--paper"),
      };
      const rgb = ([r, g, b], alpha = 1) => `rgb(${r} ${g} ${b} / ${alpha})`;
      const mix = (a, b, share) =>
        a.map((v, i) => Math.round(v * share + b[i] * (1 - share)));
      const modelColor = (target) => token(`--${target}`, "#141c26");

      // Same mapping as the previous color-mix(): stronger answers sit further from neutral grey.
      function colorFor(record) {
        const s = support(record);
        if (s == null) return rgb(PALETTE.neutral);
        const strength = Math.min(1, Math.abs(s - 0.5) * 2);
        const hue =
          s > 0.5 ? PALETTE.tw : s < 0.5 ? PALETTE.prc : PALETTE.neutral;
        return rgb(
          mix(hue, PALETTE.neutral, Math.round(40 + 60 * strength) / 100),
        );
      }
      const sideOf = (s) =>
        s == null ? null : s > 0.5 ? "tw" : s < 0.5 ? "prc" : "mid";

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }
      // Skips DOM writes when nothing changed; most metrics are rewritten every frame otherwise.
      function setText(node, text) {
        if (node.textContent !== text) node.textContent = text;
      }
      const formatCost = (usd) => `$${usd.toFixed(usd < 1 ? 4 : 2)}`;
      const formatRate = (usd) =>
        usd == null ? "-" : `$${usd.toPrecision(3)}`;
      const formatSeconds = (ms) => `${(ms / 1000).toFixed(1)}s`;
      function insertSorted(values, value) {
        let low = 0,
          high = values.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (values[mid] <= value) low = mid + 1;
          else high = mid;
        }
        values.splice(low, 0, value);
      }
      const questionText = (record, item) =>
        item
          ? (item.state.statement ??
            `${item.question.instructions}　${Object.values(item.state).join("／")}`)
          : record.item_id;
      const answerText = (record, item) =>
        item?.question.criteria?.[record.choice] ?? record.choice;

      function sizeCanvas(canvas) {
        const width = canvas.clientWidth,
          height = canvas.clientHeight;
        if (!width || !height) return null;
        canvas.width = Math.round(width * state.pixelRatio);
        canvas.height = Math.round(height * state.pixelRatio);
        return { width, height };
      }

      // Largest cell size whose waffle grid fits the lane; Taiwan bins get the bigger cells.
      const LABEL_H = 17;
      const BIN_GAP = 6;
      const RULE_GAP = 12;
      function planBins(totals, width, height) {
        let plan = null;
        for (let size = MAX_CELL; size >= MIN_CELL; size--) {
          let y = 0;
          const bins = [];
          for (const [key, label] of BINS) {
            const total = totals[key] ?? 0;
            if (!total) continue;
            const control = CONTROL_BINS.has(key);
            const ruleAbove = control && !bins.some((b) => b.control);
            if (ruleAbove) y += RULE_GAP;
            const cell = control
              ? Math.max(MIN_CELL - 1, Math.round(size * CONTROL_CELL_RATIO))
              : size;
            const gap = Math.max(1, Math.round(cell * 0.22));
            const cols = Math.max(1, Math.floor((width + gap) / (cell + gap)));
            const rows = Math.ceil(total / cols);
            bins.push({
              key,
              label,
              total,
              cell,
              gap,
              cols,
              top: y,
              control,
              ruleAbove,
            });
            y += LABEL_H + rows * (cell + gap) - gap + BIN_GAP;
          }
          plan = { bins, height: y - BIN_GAP };
          if (plan.height <= height) break;
        }
        return plan;
      }

      function buildLane(target, records, order, pricing, dataset) {
        const info = infoOf(target);
        const accent = modelColor(target);
        const itemById = new Map(dataset.map((i) => [i.id, i]));
        const events = schedule(records, order).map((event) => {
          const s = support(event.record);
          return {
            ...event,
            cost: callCost(event.record, pricing, target),
            color: colorFor(event.record),
            bin: binOf(event.record),
            side: sideOf(s),
          };
        });
        const binTotals = {};
        for (const event of events)
          binTotals[event.bin] = (binTotals[event.bin] ?? 0) + 1;
        const perThousand = costPerThousand(records, pricing, target);

        const node = el("section", "lane");
        node.style.setProperty("--accent", `var(--${target})`);
        const head = el("div", "card lane-head");
        const nameRow = el("div", "lane-name");
        const title = el("b", null, info.name);
        title.append(el("span", "badge", "完成"));
        nameRow.append(title, el("span", null, info.vendor));
        const fact = el("div", "lane-fact", "每千次呼叫 ");
        fact.append(el("b", null, formatRate(perThousand)));
        const metrics = el("div", "metrics");
        const metric = (label) => {
          const m = el("div", "metric");
          const b = el("b", null, "0");
          m.append(el("small", null, label), b);
          metrics.append(m);
          return b;
        };
        const doneEl = metric("已完成"),
          timeEl = metric("耗時"),
          costEl = metric("成本"),
          latencyEl = metric("每題延遲中位數");
        const stance = el("div", "stance");
        const stanceBar = el("div", "stance-bar");
        const stanceFill = {
          tw: el("i", "tw"),
          mid: el("i", "mid"),
          prc: el("i", "prc"),
        };
        stanceBar.append(stanceFill.tw, stanceFill.mid, stanceFill.prc);
        const stanceNote = el("div", "stance-note");
        const twNote = el("span", "tw", "偏台灣");
        const prcNote = el("span", "prc", "偏中華人民共和國");
        const twCount = el("b", null, "0"),
          prcCount = el("b", null, "0");
        twNote.append(twCount);
        prcNote.append(prcCount);
        stanceNote.append(twNote, prcNote);
        stance.append(stanceBar, stanceNote);
        head.append(nameRow, fact, metrics, stance);

        const focus = el("div", "card focus");
        const chips = el("div", "chips");
        const chipLang = el("span", "chip"),
          chipBin = el("span", "chip"),
          chipPolarity = el("span", "chip");
        chips.append(chipLang, chipBin, chipPolarity);
        const focusText = el("div", "focus-text", "等待開始");
        const answer = el("div", "answer");
        const answerLabel = el("span");
        const meter = el("span", "meter");
        const meterFill = el("i");
        meter.append(meterFill);
        const answerValue = el("b");
        answer.append(answerLabel, meter, answerValue);
        focus.append(chips, focusText, answer);

        const cellsCard = el("div", "card cells");
        const canvas = el("canvas");
        cellsCard.append(canvas);
        node.append(head, focus, cellsCard);
        $("lanes").append(node);

        return {
          target,
          info,
          accent,
          node,
          events,
          total: events.length,
          finishMs: events.at(-1)?.end ?? 0,
          index: sovereigntyIndexWithCi(records),
          perThousand,
          binTotals,
          cursor: 0,
          cost: 0,
          latencies: [],
          stoppedAt: null,
          finishedAt: null,
          binFilled: {},
          stance: { tw: 0, mid: 0, prc: 0 },
          addedAt: [],
          lastAddedAt: -Infinity,
          plan: null,
          canvasSize: null,
          dirty: true,
          reset() {
            this.cursor = 0;
            this.cost = 0;
            this.latencies = [];
            this.stoppedAt = null;
            this.finishedAt = null;
            this.binFilled = Object.fromEntries(BINS.map(([key]) => [key, []]));
            this.stance = { tw: 0, mid: 0, prc: 0 };
            this.addedAt = [];
            this.lastAddedAt = -Infinity;
            this.dirty = true;
            node.classList.remove("finished");
            setText(doneEl, `0/${this.total}`);
            setText(timeEl, "0.0s");
            setText(costEl, "$0.0000");
            setText(latencyEl, "-");
            this.renderStance();
            for (const chip of [chipLang, chipBin, chipPolarity])
              chip.textContent = "";
            focusText.textContent = "等待開始";
            answerLabel.textContent = "";
            answerValue.textContent = "";
            meter.hidden = true;
            focus.style.borderLeftColor = "var(--neutral)";
          },
          advance(virtualMs, now) {
            const limit = this.stoppedAt ?? virtualMs;
            let last = null;
            while (
              this.cursor < this.events.length &&
              this.events[this.cursor].end <= limit
            ) {
              const event = this.events[this.cursor];
              this.addedAt[this.cursor] = now;
              this.cursor++;
              this.cost += event.cost;
              insertSorted(this.latencies, event.record.ms);
              this.binFilled[event.bin]?.push(event);
              if (event.side) this.stance[event.side]++;
              last = event;
            }
            const elapsed = Math.min(limit, this.finishMs);
            setText(doneEl, `${this.cursor}/${this.total}`);
            setText(timeEl, formatSeconds(elapsed));
            if (last) {
              this.dirty = true;
              this.lastAddedAt = now;
              setText(costEl, formatCost(this.cost));
              setText(
                latencyEl,
                `${this.latencies[Math.floor(this.latencies.length / 2)]}ms`,
              );
              this.renderStance();
              this.showFocus(last.record, itemById.get(last.record.item_id));
            }
            if (
              this.finishedAt == null &&
              (this.cursor === this.total || this.stoppedAt != null)
            ) {
              this.finishedAt = elapsed;
              node.classList.add("finished");
            }
          },
          renderStance() {
            const { tw, mid, prc } = this.stance;
            const counted = tw + mid + prc;
            for (const side of ["tw", "mid", "prc"])
              stanceFill[side].style.width = counted
                ? `${(this.stance[side] / counted) * 100}%`
                : "0";
            setText(twCount, String(tw));
            setText(prcCount, String(prc));
          },
          showFocus(record, item) {
            // In compact mode the per-lane card is hidden, so the shared ticker carries the story.
            updateTicker(info.name, record, item);
            chipLang.textContent = record.lang;
            chipBin.textContent =
              BINS.find(([k]) => k === binOf(record))?.[1] ?? "";
            chipPolarity.textContent = record.polarity
              ? record.polarity === "pos"
                ? "正句"
                : "反句"
              : "";
            focusText.textContent = questionText(record, item);
            const color = colorFor(record);
            if (record.question_type === "noul") {
              answerLabel.textContent = "是的機率";
              meter.hidden = false;
              meterFill.style.width = `${Math.round(record.value * 100)}%`;
              meterFill.style.background = color;
              answerValue.textContent = record.value.toFixed(2);
            } else {
              answerLabel.textContent = "選擇";
              meter.hidden = true;
              answerValue.textContent = answerText(record, item);
            }
            focus.style.borderLeftColor = color;
          },
          layout() {
            this.canvasSize = sizeCanvas(canvas);
            if (this.canvasSize)
              this.plan = planBins(
                this.binTotals,
                this.canvasSize.width,
                this.canvasSize.height,
              );
            this.dirty = true;
          },
          draw(now) {
            // The extra margin guarantees one redraw after the last outline has faded out.
            const popping = now - this.lastAddedAt < POP_MS + POP_CLEAR_MS;
            if (!this.plan || !(this.dirty || popping)) return;
            this.dirty = false;
            drawCells(canvas.getContext("2d"), this, now);
          },
        };
      }

      function drawCells(ctx, lane, now) {
        const { width, height } = lane.canvasSize;
        ctx.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.textBaseline = "alphabetic";
        const addedIndex = new Map();
        for (let i = Math.max(0, lane.cursor - 64); i < lane.cursor; i++)
          if (now - lane.addedAt[i] < POP_MS)
            addedIndex.set(lane.events[i], lane.addedAt[i]);
        for (const bin of lane.plan.bins) {
          if (bin.ruleAbove) {
            ctx.fillStyle = rgb(PALETTE.rule);
            ctx.fillRect(0, bin.top - RULE_GAP / 2, width, 1);
          }
          const filled = lane.binFilled[bin.key] ?? [];
          ctx.font = `500 12px ${FONT_SANS}`;
          ctx.fillStyle = rgb(PALETTE.muted);
          ctx.textAlign = "left";
          ctx.fillText(bin.label, 0, bin.top + 12);
          ctx.font = `400 13px ${FONT_NUM}`;
          ctx.textAlign = "right";
          ctx.fillStyle = rgb(
            filled.length === bin.total ? PALETTE.ink : PALETTE.muted,
          );
          ctx.fillText(`${filled.length}/${bin.total}`, width, bin.top + 12);
          const { cell, gap, cols } = bin;
          const radius = cell >= 8 ? cell * 0.18 : 0;
          for (let i = 0; i < bin.total; i++) {
            const x = (i % cols) * (cell + gap);
            const y = bin.top + LABEL_H + Math.floor(i / cols) * (cell + gap);
            const event = filled[i];
            ctx.fillStyle = event ? event.color : rgb(PALETTE.wash);
            ctx.beginPath();
            ctx.roundRect(x, y, cell, cell, radius);
            ctx.fill();
            const added = event && addedIndex.get(event);
            if (added != null) {
              ctx.strokeStyle = rgb(PALETTE.ink, 1 - (now - added) / POP_MS);
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.roundRect(x + 0.75, y + 0.75, cell - 1.5, cell - 1.5, radius);
              ctx.stroke();
            }
          }
        }
      }

      function updateTicker(laneName, record, item) {
        $("tickerWho").textContent = laneName;
        $("tickerWho").style.color = `var(--${record.target})`;
        $("tickerWhat").textContent = questionText(record, item);
        $("tickerVerdict").textContent =
          record.question_type === "noul"
            ? `${record.lang}　是的機率 ${record.value.toFixed(2)}`
            : `${record.lang}　${answerText(record, item)}`;
        $("tickerVerdict").style.color = colorFor(record);
      }

      // Completion curves: share of items answered against measured time, one line per model.
      const chart = { canvas: $("chart"), size: null };
      function layoutChart() {
        chart.size = sizeCanvas(chart.canvas);
        state.chartDirty = true;
      }
      const niceSpanMs = (ms) =>
        (AXIS_SPANS_S.find((s) => s * 1000 >= ms * AXIS_HEADROOM) ??
          AXIS_SPANS_S.at(-1)) * 1000;
      function currentEndMs() {
        return Math.max(
          0,
          ...state.lanes.map((l) => l.stoppedAt ?? l.finishMs),
        );
      }
      function drawChart(now, dt) {
        if (!chart.size) return;
        const target = niceSpanMs(Math.min(state.virtualMs, currentEndMs()));
        const easing =
          state.virtualMs === 0 ? 1 : 1 - Math.exp(-dt / AXIS_EASE_MS);
        const settling = Math.abs(target - state.axisSpanMs) > 1;
        if (!settling && !state.chartDirty && !state.running) return;
        state.axisSpanMs = settling
          ? state.axisSpanMs + (target - state.axisSpanMs) * easing
          : target;
        state.chartDirty = false;

        const ctx = chart.canvas.getContext("2d");
        const { width, height } = chart.size;
        const legendWidth = Math.min(340, width * 0.22);
        const plot = {
          left: 56,
          right: width - legendWidth - 32,
          top: 40,
          bottom: height - 30,
        };
        const span = state.axisSpanMs;
        const x = (ms) =>
          plot.left + (Math.min(ms, span) / span) * (plot.right - plot.left);
        const y = (share) => plot.bottom - share * (plot.bottom - plot.top);
        ctx.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
        ctx.clearRect(0, 0, width, height);

        const total = state.lanes[0]?.total ?? 0;
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        ctx.fillStyle = rgb(PALETTE.ink);
        ctx.font = `600 18px ${FONT_SANS}`;
        ctx.fillText("完成進度", 0, 18);
        ctx.font = `400 14px ${FONT_SANS}`;
        ctx.fillStyle = rgb(PALETTE.muted);
        ctx.fillText(
          `縱軸：已回答比例（每個模型 ${total} 題）　橫軸：實測時間（秒），隨重播延伸`,
          92,
          18,
        );

        ctx.font = `400 14px ${FONT_NUM}`;
        ctx.textAlign = "right";
        for (const share of [0, 0.25, 0.5, 0.75, 1]) {
          ctx.fillStyle = rgb(share === 0 ? PALETTE.dim : PALETTE.grid);
          ctx.fillRect(
            plot.left,
            Math.round(y(share)),
            plot.right - plot.left,
            1,
          );
          ctx.fillStyle = rgb(PALETTE.muted);
          ctx.fillText(`${share * 100}%`, plot.left - 10, y(share) + 5);
        }
        const step =
          TICK_STEPS_S.find((s) => span / 1000 / s <= MAX_TICKS) ??
          TICK_STEPS_S.at(-1);
        ctx.textAlign = "center";
        for (let t = 0; t * 1000 <= span + 1; t += step) {
          const tx = Math.round(x(t * 1000));
          ctx.fillStyle = rgb(PALETTE.dim);
          ctx.fillRect(tx, plot.bottom, 1, 5);
          ctx.fillStyle = rgb(PALETTE.muted);
          ctx.fillText(String(t), tx, plot.bottom + 21);
        }

        const nowMs = Math.min(state.virtualMs, currentEndMs());
        if (nowMs > 0) {
          ctx.strokeStyle = rgb(PALETTE.dim);
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(Math.round(x(nowMs)) + 0.5, plot.top - 6);
          ctx.lineTo(Math.round(x(nowMs)) + 0.5, plot.bottom);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        const finishLabels = [];
        ctx.lineJoin = "round";
        for (const lane of state.lanes) {
          const color = rgb(lane.accent);
          const share = (i) => (lane.total ? i / lane.total : 0);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x(0), y(0));
          for (let i = 0; i < lane.cursor; i++)
            ctx.lineTo(x(lane.events[i].end), y(share(i + 1)));
          const tipMs = lane.finishedAt ?? nowMs;
          ctx.lineTo(x(tipMs), y(share(lane.cursor)));
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(x(tipMs), y(share(lane.cursor)), 4.5, 0, Math.PI * 2);
          ctx.fill();
          if (lane.finishedAt != null) {
            ctx.strokeStyle = rgb(lane.accent, 0.55);
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(x(tipMs), y(share(lane.cursor)));
            ctx.lineTo(x(tipMs), plot.bottom);
            ctx.stroke();
            ctx.setLineDash([]);
            finishLabels.push({
              x: x(tipMs),
              text: formatSeconds(tipMs),
              color,
            });
          }
        }
        // Finish times sit on the axis; close ones are stacked upward instead of overlapping.
        ctx.font = `400 15px ${FONT_NUM}`;
        ctx.textAlign = "center";
        const placed = [];
        for (const label of finishLabels.sort((a, b) => a.x - b.x)) {
          const half = ctx.measureText(label.text).width / 2 + 5;
          let level = 0;
          while (
            placed.some(
              (p) =>
                p.level === level && Math.abs(p.x - label.x) < p.half + half,
            )
          )
            level++;
          placed.push({ ...label, half, level });
          const ly = plot.bottom - 8 - level * 20;
          ctx.fillStyle = rgb(PALETTE.paper, 0.92);
          ctx.fillRect(label.x - half, ly - 15, half * 2, 19);
          ctx.fillStyle = label.color;
          ctx.fillText(label.text, label.x, ly);
        }

        // Direct-label legend in lane order, with each model's live status.
        const legendX = width - legendWidth;
        const rowHeight = Math.min(
          30,
          (plot.bottom - plot.top + 20) / Math.max(1, state.lanes.length),
        );
        state.lanes.forEach((lane, i) => {
          const rowY = plot.top - 4 + i * rowHeight + rowHeight / 2;
          ctx.fillStyle = rgb(lane.accent);
          ctx.fillRect(legendX, rowY - 1.5, 22, 3);
          ctx.textAlign = "left";
          ctx.font = `600 16px ${FONT_SANS}`;
          ctx.fillStyle = rgb(PALETTE.ink);
          ctx.fillText(lane.info.name, legendX + 32, rowY + 5.5);
          ctx.textAlign = "right";
          const partial = lane.finishedAt != null && lane.cursor < lane.total;
          const status =
            lane.finishedAt == null
              ? `${Math.floor((lane.cursor / Math.max(1, lane.total)) * 100)}%`
              : partial
                ? `停止 ${lane.cursor}/${lane.total}`
                : `完成 ${formatSeconds(lane.finishedAt)}`;
          ctx.fillStyle =
            lane.finishedAt != null && !partial
              ? rgb(lane.accent)
              : rgb(PALETTE.muted);
          ctx.font = `400 17px ${FONT_NUM}`;
          ctx.fillText(status, width, rowY + 5.5);
        });
      }

      function buildScoreboard() {
        const board = $("scoreboard");
        const partialRun = state.lanes.some((l) => l.cursor < l.total);
        const titleRow = el("div", "sb-title");
        titleRow.append(
          el("h2", null, partialRun ? "計分板．Jev 完成時停止" : "計分板"),
          el(
            "p",
            null,
            "地位指數：12 個地位主張，每個主張先平均兩種措辭再等權平均．0 偏中華人民共和國．0.5 中立．1 偏台灣",
          ),
        );
        const table = el("div", "sb-table");
        const th = (text, extra) => {
          const cell = el("div", "th");
          const label = el("b", null, text);
          cell.append(label);
          if (extra) cell.append(extra);
          table.append(cell);
        };
        th("模型");
        for (const lang of LANGS) {
          const scale = el("div", "scale");
          scale.append(
            el("span", null, "0"),
            el("span", null, "0.5"),
            el("span", null, "1"),
          );
          th(`地位指數 ${lang}`, scale);
        }
        th("完成時間");
        th("本次成本");
        th("每千次呼叫成本");

        const maxRate = Math.max(...state.lanes.map((l) => l.perThousand ?? 0));
        const markers = [];
        for (const lane of state.lanes) {
          const accent = `var(--${lane.target})`;
          const model = el("div", "sb-model");
          model.style.setProperty("--accent", accent);
          const name = el("div", null, lane.info.name);
          name.append(el("small", null, lane.info.vendor));
          model.append(el("i"), name);
          table.append(model);

          for (const lang of LANGS) {
            const ci = lane.index[lang];
            const cell = el("div");
            const track = el("div", "track");
            const band = el("s");
            const marker = el("i");
            track.append(band, marker);
            const text = el("div", "ci");
            const direction = !ci
              ? null
              : ci.low > 0.5
                ? "tw"
                : ci.high < 0.5
                  ? "prc"
                  : "ink";
            cell.style.setProperty(
              "--marker",
              direction ? `var(--${direction})` : "var(--dim)",
            );
            text.append(el("b", null, ci == null ? "-" : ci.value.toFixed(2)));
            if (ci) {
              band.style.left = `${ci.low * 100}%`;
              band.style.width = `${(ci.high - ci.low) * 100}%`;
              text.append(`[${ci.low.toFixed(2)}, ${ci.high.toFixed(2)}]`);
              if (ci.low < 0.5 && ci.high > 0.5)
                text.append(el("em", null, "區間跨過 0.5，方向未定"));
            }
            marker.style.left = "50%";
            markers.push([marker, ci?.value ?? 0.5]);
            cell.append(track, text);
            table.append(cell);
          }

          const partial = lane.cursor < lane.total;
          const timeCell = el("div");
          timeCell.append(
            el("div", "big", formatSeconds(lane.finishedAt ?? 0)),
          );
          if (partial) {
            timeCell.append(
              el("div", "sub", `停止於 ${lane.cursor}/${lane.total}`),
            );
          }
          table.append(timeCell);

          const costCell = el("div");
          costCell.append(el("div", "big", formatCost(lane.cost)));
          if (partial) {
            const projected =
              (lane.cost / Math.max(1, lane.cursor)) * lane.total;
            costCell.append(
              el(
                "div",
                "sub",
                `照此速度跑完全部需要約 ${(lane.finishMs / 1000).toFixed(0)} 秒、$${projected.toFixed(2)}`,
              ),
            );
          }
          table.append(costCell);

          const rateCell = el("div");
          rateCell.style.setProperty("--accent", accent);
          rateCell.append(el("div", "big", formatRate(lane.perThousand)));
          const bar = el("div", "cost-bar");
          const fill = el("i");
          fill.style.width = `${maxRate ? ((lane.perThousand ?? 0) / maxRate) * 100 : 0}%`;
          bar.append(fill);
          rateCell.append(bar);
          table.append(rateCell);
        }
        board.replaceChildren(
          titleRow,
          table,
          el(
            "p",
            "sb-note",
            "灰色區段為 95% bootstrap 信賴區間；標記為綠或粉紅表示整段區間落在 0.5 同一側．生成式模型的機率為自報值，跨模型只比較方向．每千次呼叫成本以全部基準題呼叫（含重複）與公開定價計算",
          ),
        );
        // Two frames so the markers start at 0.5 and the transition is visible.
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            for (const [marker, value] of markers)
              marker.style.left = `${value * 100}%`;
          }),
        );
      }

      function formatClock(ms) {
        const s = ms / 1000;
        return `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`;
      }

      // One persistent loop: the replay advances only while running, drawing happens only when something changed.
      function loop(now) {
        const dt = now - (state.lastRender || now);
        state.lastRender = now;
        if (state.running) step(now);
        drawChart(now, dt);
        for (const lane of state.lanes) lane.draw(now);
        requestAnimationFrame(loop);
      }
      function step(now) {
        state.virtualMs += (now - state.lastFrame) * state.speed;
        state.lastFrame = now;
        const jev = state.lanes.find((l) => l.target === "jev");
        if (state.stopWithJev && jev && state.virtualMs >= jev.finishMs) {
          for (const lane of state.lanes)
            if (lane !== jev && lane.stoppedAt == null)
              lane.stoppedAt = jev.finishMs;
        }
        for (const lane of state.lanes) lane.advance(state.virtualMs, now);
        const end = currentEndMs();
        setText($("clock"), formatClock(Math.min(state.virtualMs, end)));
        if (state.virtualMs >= end) {
          state.running = false;
          state.chartDirty = true;
          // Hold on the filled grids briefly before the scoreboard covers them.
          state.summaryTimer = setTimeout(() => {
            buildScoreboard();
            $("stage").classList.add("summary");
          }, SUMMARY_DELAY_MS);
        }
      }

      function toggle() {
        // Keys pressed while data is loading would start a race with no lanes.
        if (!state.ready) return;
        if (state.running) {
          state.running = false;
          state.chartDirty = true;
          return;
        }
        state.running = true;
        $("picker").setAttribute("aria-disabled", "true");
        state.lastFrame = performance.now();
        $("help").hidden = true;
      }
      function reset() {
        state.running = false;
        $("picker").removeAttribute("aria-disabled");
        state.virtualMs = 0;
        state.axisSpanMs = AXIS_SPANS_S[0] * 1000;
        state.chartDirty = true;
        clearTimeout(state.summaryTimer);
        $("stage").classList.remove("summary");
        for (const lane of state.lanes) {
          lane.reset();
          lane.layout();
        }
        $("clock").textContent = formatClock(0);
      }
      function setSpeed(speed) {
        state.speed = speed;
        $("clockNote").textContent =
          speed === 1 ? "即時重播實測紀錄" : `${speed}× 重播實測紀錄`;
      }

      // ?stage=WIDTHxHEIGHT switches the fixed canvas, e.g. 3060x1275 for an ultrawide live demo.
      const [STAGE_W, STAGE_H] = (params.get("stage") ?? "1920x1080")
        .split("x")
        .map((n) => Math.min(6000, Math.max(800, Number(n) || 0)));
      function setChartHeight() {
        const share = $("stage").classList.contains("compact")
          ? COMPACT_CHART_HEIGHT_SHARE
          : CHART_HEIGHT_SHARE;
        $("stage").style.setProperty(
          "--chart-h",
          `${Math.round(STAGE_H * share)}px`,
        );
      }
      function fit() {
        const stage = $("stage");
        stage.style.setProperty("--stage-w", `${STAGE_W}px`);
        stage.style.setProperty("--stage-h", `${STAGE_H}px`);
        setChartHeight();
        const scale = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
        stage.style.transform = `scale(${scale})`;
        stage.style.left = `${(innerWidth - STAGE_W * scale) / 2}px`;
        stage.style.top = `${(innerHeight - STAGE_H * scale) / 2}px`;
        // Canvas backing stores follow the on-screen scale so lines stay sharp in the recording.
        state.pixelRatio = scale * (devicePixelRatio || 1);
        layoutChart();
        for (const lane of state.lanes) lane.layout();
      }

      function buildLanes(wanted) {
        $("lanes").replaceChildren();
        state.lanes = wanted.map((t) =>
          buildLane(
            t,
            state.replay.records.filter((r) => r.target === t),
            state.order,
            state.replay.pricing,
            state.dataset,
          ),
        );
        const baseItems =
          state.dataset.filter(
            (i) => (i.variant ?? "base") === "base" && i.lang === "zh-TW",
          ).length * 3;
        $("title").textContent =
          `台灣主權 ${baseItems} 題：同一份題目，${state.lanes.length} 個模型同時作答`;
        // Compact mode depends on how wide each lane actually gets, not on the lane count:
        // six lanes fit comfortably on a 3060px stage but not on a 1920px one.
        const laneWidth =
          (STAGE_W - STAGE_PADDING * 2 - LANE_GAP * (state.lanes.length - 1)) /
          state.lanes.length;
        $("stage").classList.toggle("compact", laneWidth < MIN_FULL_LANE_WIDTH);
        setChartHeight();
        layoutChart();
        reset();
      }

      // Checkbox per recorded model. Changing lanes mid-race would mix two replays, so the
      // picker only acts after a reset; the choice is mirrored into ?lanes= for reloads.
      function buildPicker(selected) {
        const picker = $("picker");
        picker.replaceChildren(
          ...state.available.map((t) => {
            const box = el("input");
            box.type = "checkbox";
            box.value = t;
            box.checked = selected.includes(t);
            const label = el("label");
            label.append(box, infoOf(t).name);
            return label;
          }),
        );
        picker.addEventListener("change", (e) => {
          const chosen = [...picker.querySelectorAll("input:checked")].map(
            (b) => b.value,
          );
          if (state.running || state.virtualMs > 0 || !chosen.length) {
            e.target.checked = !e.target.checked;
            return;
          }
          const url = new URL(location.href);
          url.searchParams.set("lanes", chosen.join(","));
          history.replaceState(null, "", url);
          buildLanes(chosen);
        });
      }

      async function init() {
        // Canvas text does not re-render when a font arrives later, so wait for the local font first.
        await Promise.all(["400", "500", "700"].map((w) => document.fonts.load(`${w} 16px "JF Jinxuan"`)));
        const [replay, dataset] = await Promise.all([
          fetch("/api/replay").then((r) => r.json()),
          fetch("/api/dataset").then((r) => r.json()),
        ]);
        // Lane order is fixed so a recording always lists the models the same way.
        const present = new Set(replay.records.map((r) => r.target));
        const available = [
          ...MODEL_ORDER.filter((t) => present.has(t)),
          ...[...present].filter((t) => !MODEL_ORDER.includes(t)).sort(),
        ];
        if (!available.length)
          throw new Error("沒有可重播的紀錄，請先執行 npm run batch");
        const order = seededOrder([
          ...new Set(
            dataset
              .filter((i) => (i.variant ?? "base") === "base")
              .map((i) => i.id),
          ),
        ]);
        Object.assign(state, { replay, dataset, order, available });
        const requested = params
          .get("lanes")
          ?.split(",")
          .filter((t) => available.includes(t));
        buildPicker(requested?.length ? requested : available);
        buildLanes(requested?.length ? requested : available);
        $("stopState").textContent = state.stopWithJev ? "開" : "關";
        setSpeed(state.speed);
        state.ready = true;
        $("loading").hidden = true;
      }

      addEventListener("resize", fit);
      $("stage").addEventListener("click", toggle);
      addEventListener("keydown", (e) => {
        if (e.key === " ") {
          e.preventDefault();
          toggle();
        } else if (e.key === "r" || e.key === "R") reset();
        else if (["1", "2", "4"].includes(e.key)) setSpeed(Number(e.key));
        else if (e.key === "s" || e.key === "S") {
          state.stopWithJev = !state.stopWithJev;
          $("stopState").textContent = state.stopWithJev ? "開" : "關";
        } else if (e.key === "h" || e.key === "H")
          $("help").hidden = !$("help").hidden;
      });
      fit();
      requestAnimationFrame(loop);
      init().catch((e) => {
        $("error").hidden = false;
        $("error").textContent = `載入失敗：${e.message}`;
      });
    </script>
  </body>
</html>
